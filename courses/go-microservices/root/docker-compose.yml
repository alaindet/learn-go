services:

  broker:
    build:
      # Context is the project root so the build can see both the broker
      # service and the shared "common" module that broker/go.mod points at
      # via "replace common => ../common".
      context: ../
      dockerfile: broker/Dockerfile
    restart: always
    ports:
      - "8080:80"
    deploy:
      mode: replicated
      replicas: 1

  authentication:
    build:
      # Context is the project root so the build can also reach the shared
      # "common" module alongside the authentication service.
      context: ../
      dockerfile: authentication/Dockerfile
    restart: always
    ports:
      - "8081:80"
    deploy:
      mode: replicated
      replicas: 1
    environment:
      DSN: "host=postgres port=5432 user=postgres password=password dbname=users sslmode=disable timezone=UTC connect_timeout=5"

  postgres:
    image: 'postgres:14.2'
    # restart: 'always'
    ports:
      - "5432:5432"
    deploy:
      mode: replicated
      replicas: 1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: users
    volumes:
      - ./db-data/postgres/:/var/lib/postgresql/data/