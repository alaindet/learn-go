services:
  postgres:
    image: postgres:18-alpine
    container_name: greenlight_container
    environment:
      POSTGRES_DB: greenlight_db
      POSTGRES_USER: greenlight_usr
      POSTGRES_PASSWORD: greenlight_pwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
